# Python environment managed by UnrealPy. Commit this file and uv.lock.
[project]
name = "unrealpydoom"
version = "0.1.0"
requires-python = ">=3.11,<3.16"
dependencies = [
    "numpy>=2.0.0,<3; python_version < '3.15'",
    "numpy>=2.5.5,<3; python_version >= '3.15'",
    "typing-extensions>=4.12",
]

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[tool.uv]
# The game lives under Content/Python/gameplay and is put on sys.path by UnrealPy; nothing to build.
package = false

[tool.pytest.ini_options]
# Outside the engine only the unit tests run; the scenarios run in the engine (see README.md, Test).
testpaths = ["Tests/unit"]
pythonpath = ["Content/Python/gameplay"]
# Outside Unreal, `ue` runs on UnrealPy's engine-less fake.
addopts = "-p unrealpy_testing.pytest_plugin"

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["Content/Python", "Plugins/UnrealPy/Content/Python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ue", "doom"]

[tool.ty.environment]
python = ".venv"
extra-paths = ["Intermediate/PythonStubs", "Content/Python/gameplay", "Plugins/UnrealPy/Content/Python"]
