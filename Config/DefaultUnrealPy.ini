[/Script/UnrealPyCore.UnrealPySettings]
VenvPath=.venv
; The game's classes (game mode, marine, monsters, game and player state...) are found in this package.
+ClassPackages=doom
; A game (standalone -game or a packaged build) starts Doom; -UnrealPyRun replaces it.
StartupModule=doom.game:play

+NativeModules=doom.*
NativePlatforms=Desktop
+StageExclude=doom_local
