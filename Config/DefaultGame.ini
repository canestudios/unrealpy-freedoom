[/Script/UnrealEd.ProjectPackagingSettings]
; The game loads its imported assets by path, so the cook must be told about them. Only the Freedoom data set
; is cooked: a build that is shared must never contain the retail data.
+DirectoriesToAlwaysCook=(Path="/Game/FreedoomLocal")
+DirectoriesToNeverCook=(Path="/Game/DoomLocal")
