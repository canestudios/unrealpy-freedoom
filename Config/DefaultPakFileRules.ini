; The music's audio data goes to a late container (pakchunk1): the web page downloads every other container before
; play and this one after, so two hours of music do not hold up the first start. The music assets themselves stay in
; the main container, so references resolve; a track read before its container is in fetches only its own bytes.
; The first matching section wins; `*` stays inside one folder.
[LateMusicData]
bOverrideChunkManifest=true
OverridePaks="pakchunk1"
+Files=".../UnrealPyDoom/Content/FreedoomLocal/music/*.ubulk"
