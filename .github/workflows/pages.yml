# Publishes the web build on GitHub Pages. The build needs Unreal Engine and the UnrealPy plugin, so it is made
# locally (tools/package-web.ps1) and uploaded as a release asset (tools/deploy-web.ps1), which this workflow
# publishes as it is: deploying a Pages artifact runs no Jekyll (which would drop the `_` files Python needs) and
# has no per-file size limit of git.
name: Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release holding web.zip
        default: web-build

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as in GitHub's Pages workflows: a deploy step in the job that uploaded the artifact can list the run's
# artifacts before the upload shows there, and fail finding none.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the web build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern web.zip
          mkdir site
          unzip -q web.zip -d site
          touch site/.nojekyll
          du -sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
